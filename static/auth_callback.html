<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open RescueNet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d47a1;
      color: #fff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      color: #123;
      max-width: 420px;
      width: 100%;
      border-radius: 20px;
      padding: 28px;
      text-align: center;
    }
    a.btn {
      display: inline-block;
      margin-top: 18px;
      background: #1565c0;
      color: #fff;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: bold;
    }
    p { line-height: 1.45; }
    .err { color: #b71c1c; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>RescueNet</h1>
    <p id="status">Tap the button to open the RescueNet app and finish login or set a new password. Chrome cannot open the app by itself.</p>
    <p id="error" class="err" hidden></p>
    <a class="btn" id="open" href="rescunet://login-callback">Open RescueNet</a>
  </div>
  <script>
    var qs = window.location.search || "";
    var hash = window.location.hash || "";
    var custom = "rescunet://login-callback" + qs + hash;
    var intent = "intent://login-callback" + qs + hash +
      "#Intent;scheme=rescunet;package=com.example.first_project;end";
    var params = new URLSearchParams(qs.replace(/^\?/, ""));
    var err = params.get("error_description") || params.get("error");
    if (err) {
      document.getElementById("error").hidden = false;
      document.getElementById("error").textContent = err;
    }
    var btn = document.getElementById("open");
    var isAndroid = /android/i.test(navigator.userAgent);
    btn.href = isAndroid ? intent : custom;
  </script>
</body>
</html>
