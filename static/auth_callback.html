<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open RescueNet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d47a1;
      color: #fff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      color: #123;
      max-width: 420px;
      width: 100%;
      border-radius: 20px;
      padding: 28px;
      text-align: center;
    }
    a.btn {
      display: inline-block;
      margin-top: 18px;
      background: #1565c0;
      color: #fff;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: bold;
    }
    p { line-height: 1.45; }
  </style>
</head>
<body>
  <div class="card">
    <h1>RescueNet</h1>
    <p id="status">Opening the RescueNet app so you can finish login or set a new password.</p>
    <p>If nothing happens, tap the button below. Use this on the phone that has RescueNet installed.</p>
    <a class="btn" id="open" href="#">Open RescueNet</a>
  </div>
  <script>
    function appUrl() {
      var qs = window.location.search || "";
      var hash = window.location.hash || "";
      return "rescunet://login-callback" + qs + hash;
    }
    function go() {
      var url = appUrl();
      document.getElementById("open").href = url;
      window.location.replace(url);
    }
    go();
  </script>
</body>
</html>
